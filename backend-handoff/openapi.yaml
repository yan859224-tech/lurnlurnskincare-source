openapi: 3.0.3
info:
  title: LurnLurn Skincare backend API contract
  version: 0.1.0
  description: Draft contract for backend developers; endpoints must be implemented server-side. Frontend is a demo until connected.
servers:
  - url: https://api.example.invalid/v1
    description: Replace with actual HTTPS backend base URL
paths:
  /public/products:
    get:
      summary: Public product list, pagination and filters
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: category
          schema: {type: string}
        - in: query
          name: brand
          schema: {type: string}
        - in: query
          name: q
          schema: {type: string}
      responses:
        '200':
          description: Products and pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Product'}}
                  total: {type: integer}
  /public/promotions:
    get:
      summary: Approved homepage promotions (scheduled and active)
      responses:
        '200':
          description: Promotional slides
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Promotion'}}
  /auth/me:
    get:
      summary: Get current authenticated session
      responses:
        '200': {description: User and role assigned by server}
        '401': {description: Session expired or unauthenticated}
  /auth/login:
    post:
      summary: Login with secure server-session cookie
      responses:
        '200': {description: Authenticated and HttpOnly Secure cookie issued}
        '401': {description: Invalid credentials}
  /auth/register:
    post:
      summary: Register a normal customer account
      responses:
        '201': {description: Customer account created}
  /auth/logout:
    post:
      summary: Destroy active session
      responses:
        '200': {description: Signed out}
  /orders:
    post:
      summary: Place order – validate stock and recalculate pricing on server
      responses:
        '201': {description: Order created with pending payment status}
        '409': {description: Price or inventory conflict}
        '401': {description: Login required}
  /conversations/messages:
    post:
      summary: Relay a voluntarily submitted store chat message to Telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel,message]
              properties:
                channel: {type: string, enum: [telegram]}
                message: {type: string, minLength: 1, maxLength: 1000}
                source: {type: string, example: store-chat}
      responses:
        '202': {description: Queued for store delivery}
        '429': {description: Rate limited}
  /admin/products:
    get:
      summary: Admin or Super Admin product management list
      responses:
        '200': {description: Authorized product list}
        '403': {description: Role insufficient}
  /admin/products/{id}:
    patch:
      summary: Staff edit product details, stock and active status
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Product updated}
        '403': {description: Admin role required}
  /admin/orders:
    get:
      summary: Staff view store orders
      responses:
        '200': {description: Order records}
  /admin/conversations:
    get:
      summary: Staff view customer contact requests
      responses:
        '200': {description: Conversation records}
  /admin/promotions:
    get:
      summary: Staff view campaign placements
      responses:
        '200': {description: Campaign records}
  /admin/promotions/{id}:
    patch:
      summary: Update approved homepage campaign
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Campaign saved}
  /admin/team:
    get:
      summary: Super Admin only – manage staff
      responses:
        '200': {description: Staff list}
        '403': {description: Super Admin role required}
  /admin/settings:
    get:
      summary: Super Admin only – store security settings
      responses:
        '200': {description: Settings list}
  /admin/audit:
    get:
      summary: Super Admin only – immutable staff audit events
      responses:
        '200': {description: Audit event list}
components:
  schemas:
    Product:
      type: object
      required: [id,brand,name,price,stock,active]
      properties:
        id: {type: integer}
        sku: {type: string}
        brand: {type: string}
        name: {type: string}
        category: {type: string}
        size: {type: string}
        price: {type: number, minimum: 0, description: USD base price}
        old: {type: number, nullable: true}
        image: {type: string, format: uri}
        stock: {type: integer, minimum: 0}
        active: {type: boolean}
        benefits: {type: array, items: {type: string}}
        concerns: {type: array, items: {type: string}}
    Promotion:
      type: object
      required: [id,promoType,promoLabel,productId,active]
      properties:
        id: {type: integer}
        promoType: {type: string, enum: [discount,bestseller,trending,promotion]}
        promoLabel: {type: string}
        promoLine: {type: string}
        productId: {type: integer}
        discountPercent: {type: number, nullable: true}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        active: {type: boolean}
        priority: {type: integer}
